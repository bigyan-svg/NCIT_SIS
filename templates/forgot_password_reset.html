<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - NCIT SIS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <div class="login-container">
        <div class="login-visual">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="visual-content">
                <img src="{{ url_for('static', filename='Logo.png') }}" alt="NCIT Logo" class="login-logo">
                <h1>Set Password</h1>
                <p>Create a new password</p>
                <small>{{ user_name }}</small>
            </div>
        </div>

        <div class="login-form-wrapper">
            <div class="login-header">
                <h2>New Password</h2>
                <p>Password must be at least 6 characters.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'message' else 'danger' }} alert-dismissible fade show" role="alert">
                            <small>{{ message }}</small>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-floating mb-3 position-relative">
                    <input type="password" class="form-control" id="new_password" name="new_password"
                           placeholder="New Password" minlength="6" required>
                    <label for="new_password">New Password</label>
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                </div>

                <div class="form-floating mb-4 position-relative">
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Confirm Password" minlength="6" required>
                    <label for="confirm_password">Confirm New Password</label>
                    <span class="input-group-text"><i class="fas fa-shield-alt"></i></span>
                </div>

                <button type="submit" class="btn btn-login">
                    Update Password <i class="fas fa-save ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
